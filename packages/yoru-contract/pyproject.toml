[project]
name = "yoru-contract"
version = "0.1.0"
description = "Yoru's co-located contract — CanonicalEvent schema + device-code pairing wire types, consumed by both the backend and yoru-cli."
license = { text = "MIT" }
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yoru_contract"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
